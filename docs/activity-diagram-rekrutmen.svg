<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title description">
  <title id="title">Activity Diagram Proses Rekrutmen Sistem Disnaker Kabupaten Cirebon</title>
  <desc id="description">Diagram aktivitas formal proses rekrutmen antara admin Disnaker, perusahaan atau recruiter, dan pencari kerja.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#000000"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #000; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #222; }
      .lane { font: 700 19px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .label { font: 600 16px Arial, sans-serif; fill: #000; text-anchor: middle; }
      .small { font: 400 14px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .choice { font: 700 14px Arial, sans-serif; fill: #000; text-anchor: middle; }
      .note { font: 600 13px Arial, sans-serif; fill: #000; }
      .flow { fill: none; stroke: #000; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #000; stroke-width: 2.2; }
      .decision { fill: #fff; stroke: #000; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1600" height="1460" fill="#fff"/>
  <text x="800" y="48" class="title" text-anchor="middle">ACTIVITY DIAGRAM PROSES REKRUTMEN</text>
  <text x="800" y="75" class="subtitle" text-anchor="middle">Sistem Pencari Kerja Disnaker Kabupaten Cirebon</text>

  <!-- Swimlanes -->
  <rect x="60" y="105" width="470" height="1290" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="550" y="105" width="470" height="1290" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="1040" y="105" width="500" height="1290" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="60" y="105" width="470" height="50" fill="#000"/>
  <rect x="550" y="105" width="470" height="50" fill="#000"/>
  <rect x="1040" y="105" width="500" height="50" fill="#000"/>
  <text x="295" y="138" class="lane">ADMIN DISNAKER</text>
  <text x="785" y="138" class="lane">PERUSAHAAN / RECRUITER</text>
  <text x="1290" y="138" class="lane">PENCARI KERJA</text>

  <!-- Verifikasi perusahaan -->
  <circle cx="295" cy="205" r="12" fill="#000"/>
  <path class="flow" d="M295 217 V245"/>
  <rect class="box" x="155" y="245" width="280" height="64" rx="3"/>
  <text x="295" y="272" class="label">Verifikasi perusahaan</text>
  <text x="295" y="295" class="small">dan dokumen pendukung</text>
  <path class="flow" d="M295 309 V342"/>
  <path class="decision" d="M295 342 L380 392 L295 442 L210 392 Z"/>
  <text x="295" y="397" class="choice">Data valid?</text>
  <text x="391" y="378" class="note">Tidak</text>
  <path class="flow" d="M380 392 H470 V472 H425"/>
  <rect class="box" x="350" y="472" width="150" height="58" rx="3"/>
  <text x="425" y="497" class="label">Ditolak /</text>
  <text x="425" y="517" class="small">perbaikan data</text>
  <path class="flow" d="M425 530 V550"/>
  <circle cx="425" cy="572" r="16" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="425" cy="572" r="9" fill="#000"/>
  <text x="312" y="456" class="note">Ya</text>
  <path class="flow" d="M295 442 V545 H665 V530"/>

  <!-- Publikasi dan pelamaran -->
  <rect class="box" x="665" y="466" width="270" height="64" rx="3"/>
  <text x="800" y="493" class="label">Publikasikan lowongan</text>
  <text x="800" y="516" class="small">status: ACTIVE</text>
  <path class="flow" d="M935 498 H1180"/>
  <rect class="box" x="1180" y="466" width="220" height="64" rx="3"/>
  <text x="1290" y="493" class="label">Pilih lowongan</text>
  <text x="1290" y="516" class="small">yang tersedia</text>
  <path class="flow" d="M1290 530 V620"/>
  <rect class="box" x="1160" y="620" width="260" height="64" rx="3"/>
  <text x="1290" y="647" class="label">Lengkapi profil dan CV,</text>
  <text x="1290" y="670" class="small">kemudian kirim lamaran (PENDING)</text>
  <path class="flow" d="M1160 652 H935"/>

  <!-- Seleksi administrasi -->
  <rect class="box" x="665" y="620" width="270" height="64" rx="3"/>
  <text x="800" y="647" class="label">Tinjau lamaran</text>
  <text x="800" y="670" class="small">status: REVIEWING</text>
  <path class="flow" d="M800 684 V718"/>
  <path class="decision" d="M800 718 L890 768 L800 818 L710 768 Z"/>
  <text x="800" y="773" class="choice">Lolos seleksi?</text>
  <text x="900" y="754" class="note">Tidak</text>
  <path class="flow" d="M890 768 H1090 V848 H1160"/>
  <rect class="box" x="1160" y="816" width="260" height="64" rx="3"/>
  <text x="1290" y="843" class="label">Notifikasi penolakan</text>
  <text x="1290" y="866" class="small">status: REJECTED</text>
  <path class="flow" d="M1290 880 V900"/>
  <circle cx="1290" cy="922" r="16" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="1290" cy="922" r="9" fill="#000"/>

  <text x="817" y="832" class="note">Ya</text>
  <path class="flow" d="M800 818 V900"/>
  <rect class="box" x="665" y="900" width="270" height="64" rx="3"/>
  <text x="800" y="927" class="label">Jadwalkan wawancara</text>
  <text x="800" y="950" class="small">status: INTERVIEW_SCHEDULED</text>
  <path class="flow" d="M935 932 H1090 V1022 H1160"/>

  <!-- Wawancara dan keputusan akhir -->
  <rect class="box" x="1160" y="990" width="260" height="64" rx="3"/>
  <text x="1290" y="1017" class="label">Konfirmasi dan ikuti</text>
  <text x="1290" y="1040" class="small">wawancara</text>
  <path class="flow" d="M1160 1022 H990 V1060 H800"/>
  <path class="decision" d="M800 1060 L890 1110 L800 1160 L710 1110 Z"/>
  <text x="800" y="1115" class="choice">Diterima?</text>
  <text x="900" y="1096" class="note">Tidak</text>
  <path class="flow" d="M890 1110 H1090 V1188 H1160"/>
  <rect class="box" x="1160" y="1156" width="260" height="64" rx="3"/>
  <text x="1290" y="1183" class="label">Hasil akhir: ditolak</text>
  <text x="1290" y="1206" class="small">status: REJECTED</text>
  <path class="flow" d="M1290 1220 V1240"/>
  <circle cx="1290" cy="1262" r="16" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="1290" cy="1262" r="9" fill="#000"/>

  <text x="817" y="1174" class="note">Ya</text>
  <path class="flow" d="M800 1160 V1295 H1160"/>
  <rect class="box" x="1160" y="1263" width="260" height="64" rx="3"/>
  <text x="1290" y="1290" class="label">Hasil akhir: diterima</text>
  <text x="1290" y="1313" class="small">status: ACCEPTED</text>
  <path class="flow" d="M1290 1327 V1347"/>
  <circle cx="1290" cy="1369" r="16" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="1290" cy="1369" r="9" fill="#000"/>
</svg>
